<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>故事图谱 · Words to Story</title>
  <meta name="description" content="Story Graph · Made by Grayson Shen" />
  <style>
    :root {
      --bg: #08090c;
      --ink: #ECE7D9;
      --ink-soft: rgba(236, 231, 217, 0.58);
      --ink-faint: rgba(236, 231, 217, 0.34);
      --gold: #D9B26A;
      --gold-soft: rgba(217, 178, 106, 0.42);
      --hair: rgba(236, 231, 217, 0.12);
      --rose: #D9917A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    #graph-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    /* ===== 顶部栏 ===== */
    .top-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      pointer-events: none;
    }
    .top-bar > * { pointer-events: auto; }
    .brand {
      display: flex;
      align-items: baseline;
      gap: 14px;
    }
    .brand h1 {
      font-size: 18px;
      font-weight: 300;
      letter-spacing: 5px;
      color: var(--ink);
    }
    .brand .sub {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-links a {
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--ink-faint);
      text-decoration: none;
      transition: color 0.25s ease;
    }
    .nav-links a:hover { color: var(--ink); }

    /* ===== 筛选栏 ===== */
    .filter-bar {
      position: fixed;
      top: 70px; left: 28px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .filter-label {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--ink-faint);
      text-transform: uppercase;
      margin-right: 4px;
    }
    .filter-chip {
      background: none;
      border: 1px solid var(--hair);
      color: var(--ink-soft);
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      padding: 3px 10px;
      border-radius: 12px;
      font-family: inherit;
      transition: all 0.25s ease;
    }
    .filter-chip:hover { border-color: var(--gold-soft); color: var(--ink); }
    .filter-chip.active { border-color: var(--gold); color: var(--gold); }
    .stats-text {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--ink-faint);
      margin-top: 6px;
    }
    .stats-text b { color: var(--gold); font-weight: 500; }

    /* ===== 提示 ===== */
    .hint-bottom {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--ink-faint);
      pointer-events: none;
    }

    /* ===== 侧边信息卡 ===== */
    .info-panel {
      position: fixed;
      top: 0; right: 0;
      width: 380px; max-width: 92vw;
      height: 100%;
      z-index: 20;
      background: rgba(10, 12, 16, 0.96);
      border-left: 1px solid var(--hair);
      padding: 32px 28px;
      overflow-y: auto;
      transform: translateX(100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .info-panel.show { transform: translateX(0); }
    .info-close {
      position: absolute;
      top: 20px; right: 22px;
      background: none; border: none;
      color: var(--ink-faint);
      font-size: 20px; cursor: pointer;
      font-family: inherit;
      transition: color 0.25s ease;
    }
    .info-close:hover { color: var(--ink); }
    .info-type {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .info-title {
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 3px;
      color: var(--ink);
      margin-bottom: 6px;
      word-break: break-all;
    }
    .info-meta {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--ink-faint);
      margin-bottom: 20px;
      line-height: 1.8;
    }
    .info-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }
    .info-tag {
      font-size: 11px;
      letter-spacing: 1px;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid var(--hair);
      color: var(--ink-soft);
    }
    .info-tag.gold { border-color: var(--gold-soft); color: var(--gold); }
    .info-story-text {
      font-family: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif SC", Georgia, serif;
      font-size: 15px;
      line-height: 2;
      letter-spacing: 1px;
      color: var(--ink);
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--hair);
    }
    .info-section-title {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--gold);
      margin-bottom: 10px;
    }
    .info-word-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      margin-bottom: 20px;
    }
    .info-word-item {
      font-size: 12px;
      letter-spacing: 1px;
    }
    .info-word-item .en { color: var(--ink); }
    .info-word-item .cn { color: var(--ink-faint); }

    /* ===== SVG 节点交互 ===== */
    .node-group { cursor: pointer; }
    .node-group:hover .node-circle { filter: brightness(1.3); }
  </style>
</head>
<body>
  <svg id="graph-canvas"></svg>

  <header class="top-bar">
    <div class="brand">
      <h1>故 事 图 谱</h1>
      <span class="sub">Story Graph</span>
    </div>
    <nav class="nav-links">
      <a href="/">主 页</a>
      <a href="/admin">管 理</a>
    </nav>
  </header>

  <div class="filter-bar">
    <div class="filter-row">
      <span class="filter-label">风格</span>
      <button class="filter-chip active" data-style="">全部</button>
      <button class="filter-chip" data-style="荒诞脑洞">荒诞</button>
      <button class="filter-chip" data-style="温馨治愈">温馨</button>
      <button class="filter-chip" data-style="悬疑推理">悬疑</button>
      <button class="filter-chip" data-style="童话奇遇">童话</button>
    </div>
    <div class="filter-row">
      <span class="filter-label">评价</span>
      <button class="filter-chip active" data-rating="">全部</button>
      <button class="filter-chip" data-rating="good">夯</button>
      <button class="filter-chip" data-rating="bad">拉</button>
      <button class="filter-chip" data-rating="none">未评价</button>
    </div>
    <div class="stats-text" id="statsText">加载中…</div>
  </div>

  <div class="hint-bottom">拖拽节点 · 滚轮缩放 · 点击查看详情</div>

  <aside class="info-panel" id="infoPanel">
    <button class="info-close" id="infoClose">&times;</button>
    <div id="infoContent"></div>
  </aside>

  <script src="https://d3js.org/d3.v7.min.js">
  </script>
  <script>
    // ==================== 主逻辑 ====================
    const svg = d3.select("#graph-canvas");
    const { innerWidth: W, innerHeight: H } = window;
    svg.attr("viewBox", [0, 0, W, H]);

    const g = svg.append("g");
    const zoom = d3.zoom().scaleExtent([0.15, 4]).on("zoom", (e) => g.attr("transform", e.transform));
    svg.call(zoom);

    const infoPanel = document.getElementById("infoPanel");
    const infoContent = document.getElementById("infoContent");
    const infoClose = document.getElementById("infoClose");
    const statsText = document.getElementById("statsText");

    let allRecords = [];
    let filterStyle = "";
    let filterRating = "";

    // 关闭信息卡
    infoClose.addEventListener("click", () => infoPanel.classList.remove("show"));
    svg.on("click", (e) => {
      if (e.target === svg.node()) infoPanel.classList.remove("show");
    });

    // 筛选按钮
    document.querySelectorAll(".filter-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const group = chip.parentElement.querySelector(".filter-label").textContent;
        if (group === "风格") {
          document.querySelectorAll('[data-style]').forEach((c) => c.classList.remove("active"));
          filterStyle = chip.dataset.style;
        } else {
          document.querySelectorAll('[data-rating]').forEach((c) => c.classList.remove("active"));
          filterRating = chip.dataset.rating;
        }
        chip.classList.add("active");
        rebuildGraph();
      });
    });

    // 取数据
    async function load() {
      try {
        const res = await fetch("/api/graph-data");
        const d = await res.json();
        allRecords = d.records || [];
      } catch (e) {
        allRecords = [];
      }
      rebuildGraph();
    }

    function rebuildGraph() {
      // 筛选
      let records = allRecords.slice().reverse();
      if (filterStyle) records = records.filter((r) => (r.style || "荒诞脑洞") === filterStyle);
      if (filterRating === "good") records = records.filter((r) => r.rating === "good");
      else if (filterRating === "bad") records = records.filter((r) => r.rating === "bad");
      else if (filterRating === "none") records = records.filter((r) => r.rating == null);

      // 构建图数据
      const wordMap = new Map();   // lowerWord → { word, cns: Set, count }
      const nodes = [];
      const links = [];

      records.forEach((r, i) => {
        const sid = "s_" + (r.id || i);
        nodes.push({
          id: sid,
          type: "story",
          label: (r.story || "").slice(0, 20) + "…",
          full: r,
          degree: (r.words || []).length,
        });
        (r.words || []).forEach((w) => {
          const lw = (w.word || "").toLowerCase();
          if (!lw) return;
          if (!wordMap.has(lw)) {
            wordMap.set(lw, { word: w.word, cns: new Set(), count: 0 });
          }
          const entry = wordMap.get(lw);
          entry.cns.add(w.cn || "");
          entry.count++;
          links.push({ source: sid, target: "w_" + lw });
        });
      });

      wordMap.forEach((v, k) => {
        nodes.push({
          id: "w_" + k,
          type: "word",
          label: v.word,
          cns: [...v.cns],
          degree: v.count,
        });
      });

      const storyCount = records.length;
      const wordCount = wordMap.size;
      statsText.innerHTML = '<b>' + storyCount + '</b> 个故事 &nbsp;·&nbsp; <b>' + wordCount + '</b> 个单词';

      if (nodes.length === 0) { g.selectAll("*").remove(); return; }
      renderGraph(nodes, links);
    }

    // ==================== D3 力导向图 ====================
    let simulation = null;

    function renderGraph(nodes, links) {
      g.selectAll("*").remove();
      if (simulation) simulation.stop();

      // 颜色映射
      const getColor = (d) => d.type === "story" ? "#D9B26A" : "#ECE7D9";
      const getRadius = (d) => {
        const base = d.type === "story" ? 7 : 4.5;
        const scale = Math.min(d.degree || 1, 12);
        return base + scale * 1.4;
      };

      // 连线
      const link = g.append("g")
        .attr("stroke", "rgba(236, 231, 217, 0.15)")
        .attr("stroke-width", 0.6)
        .selectAll("line")
        .data(links)
        .join("line");

      // 节点组
      const node = g.append("g")
        .selectAll("g")
        .data(nodes)
        .join("g")
        .attr("class", "node-group")
        .call(drag(simulation));

      // 光晕（仅在故事节点上）
      node.filter((d) => d.type === "story")
        .append("circle")
        .attr("r", (d) => getRadius(d) + 6)
        .attr("fill", "none")
        .attr("stroke", "rgba(217, 178, 106, 0.18)")
        .attr("stroke-width", 1.5);

      // 主体圆
      node.append("circle")
        .attr("class", "node-circle")
        .attr("r", (d) => getRadius(d))
        .attr("fill", (d) => getColor(d))
        .attr("opacity", 0.85);

      // 点击
      node.on("click", (event, d) => {
        event.stopPropagation();
        showInfoPanel(d);
      });

      // 悬停高亮
      node.on("mouseenter", (event, d) => {
        const connected = new Set();
        links.forEach((l) => {
          const s = typeof l.source === "object" ? l.source.id : l.source;
          const t = typeof l.target === "object" ? l.target.id : l.target;
          if (s === d.id) connected.add(t);
          if (t === d.id) connected.add(s);
        });
        connected.add(d.id);

        node.selectAll("circle").attr("opacity", (n) => connected.has(n.id) ? 0.9 : 0.12);
        link.attr("stroke-opacity", (l) => {
          const s = typeof l.source === "object" ? l.source.id : l.source;
          const t = typeof l.target === "object" ? l.target.id : l.target;
          return (s === d.id || t === d.id) ? 0.5 : 0.04;
        });
      });

      node.on("mouseleave", () => {
        node.selectAll("circle").attr("opacity", 0.85);
        link.attr("stroke-opacity", null);
      });

      // 力模拟
      simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id((d) => d.id).distance(80).strength(0.4))
        .force("charge", d3.forceManyBody().strength(-180))
        .force("center", d3.forceCenter(W / 2, H / 2))
        .force("collision", d3.forceCollide((d) => getRadius(d) + 8))
        .force("x", d3.forceX(W / 2).strength(0.02))
        .force("y", d3.forceY(H / 2).strength(0.02))
        .alphaDecay(0.015)
        .on("tick", () => {
          link
            .attr("x1", (d) => d.source.x)
            .attr("y1", (d) => d.source.y)
            .attr("x2", (d) => d.target.x)
            .attr("y2", (d) => d.target.y);
          node.attr("transform", (d) => "translate(" + d.x + "," + d.y + ")");
        });
    }

    // ==================== 拖拽 ====================
    function drag(sim) {
      function started(event, d) {
        if (!event.active) sim.alphaTarget(0.3).restart();
        d.fx = d.x; d.fy = d.y;
      }
      function dragged(event, d) {
        d.fx = event.x; d.fy = event.y;
      }
      function ended(event, d) {
        if (!event.active) sim.alphaTarget(0);
        d.fx = null; d.fy = null;
      }
      return d3.drag().on("start", started).on("drag", dragged).on("end", ended);
    }

    // ==================== 侧边信息卡 ====================
    function esc(s) {
      return String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[m]));
    }

    function showInfoPanel(d) {
      if (d.type === "story") {
        const r = d.full;
        const ri = r.rating === "good" ? "夯" : r.rating === "bad" ? "拉" : "未评价";
        const riCls = r.rating === "good" ? "gold" : r.rating === "bad" ? "" : "";
        infoContent.innerHTML = `
          <div class="info-type">故事节点</div>
          <div class="info-title">#${r.seq || "—"}</div>
          <div class="info-meta">
            ${esc(r.ts)}<br>
            ${esc(r.style || "荒诞脑洞")}
          </div>
          <div class="info-tags">
            <span class="info-tag ${riCls}">${ri}</span>
            ${r.source === "example" ? '<span class="info-tag">示例</span>' : ""}
          </div>
          <div class="info-story-text">${esc(r.story)}</div>
          ${r.feature ? '<div class="info-story-text" style="color:var(--gold);border:none;padding-bottom:0;margin-bottom:14px;">好在哪里 · ' + esc(r.feature) + '</div>' : ""}
          <div class="info-section-title">用词</div>
          <div class="info-word-list">
            ${(r.words || []).map((w) => '<span class="info-word-item"><span class="en">' + esc(w.word) + '</span> <span class="cn">' + esc(w.cn) + '</span></span>').join("")}
          </div>
        `;
      } else {
        infoContent.innerHTML = `
          <div class="info-type">单词节点</div>
          <div class="info-title">${esc(d.label)}</div>
          <div class="info-meta">出现在 <b style="color:var(--gold)">${d.degree}</b> 个故事中</div>
          <div class="info-section-title">中文翻译</div>
          <div class="info-word-list">
            ${(d.cns || []).map((cn) => '<span class="info-word-item"><span class="cn">' + esc(cn) + '</span></span>').join(" · ")}
          </div>
        `;
      }
      infoPanel.classList.add("show");
    }

    // ==================== 响应窗口大小 ====================
    window.addEventListener("resize", () => {
      const { innerWidth: w, innerHeight: h } = window;
      svg.attr("viewBox", [0, 0, w, h]);
      if (simulation) simulation.force("center", d3.forceCenter(w / 2, h / 2)).restart();
    });

    load();
  </script>
</body>
</html>
