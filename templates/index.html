<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Words to Story</title>
  <meta name="description" content="Made by Grayson Shen" />
  <style>
    :root {
      --bg: #08091a;
      --card: rgba(255, 255, 255, 0.045);
      --card-strong: rgba(255, 255, 255, 0.075);
      --line: rgba(255, 255, 255, 0.10);
      --line-strong: rgba(255, 255, 255, 0.20);
      --text: #edeef7;
      --muted: #9aa0c4;
      --primary: #8b6cff;
      --primary2: #ff79c6;
      --accent: #5ce1e6;
      --mark: #ffe27a;
      --marktext: #1a1500;
      --err: #ff8a8a;
      --radius: 18px;
      --shadow: 0 24px 70px -28px rgba(0, 0, 0, 0.75);
      --grad: linear-gradient(120deg, var(--primary), var(--primary2));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 36px 16px 56px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .app { max-width: 700px; margin: 0 auto; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: none; }
    }

    .hero { text-align: center; margin: 10px 0 30px; }
    .hero h1 {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.5px;
      background: linear-gradient(100deg, #ffffff 0%, var(--primary) 48%, var(--primary2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 6px 26px rgba(139, 108, 255, 0.35));
    }
    .sub {
      color: var(--muted);
      margin-top: 12px;
      font-size: 16px;
      font-weight: 400;
      letter-spacing: 0.5px;
    }
    .sub strong { font-weight: 700; color: var(--text); }

    .card {
      position: relative;
      background: linear-gradient(180deg, var(--card-strong), var(--card));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }
    .field-label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 12px; letter-spacing: 0.3px; }
    textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--text);
      padding: 15px;
      font-size: 16px;
      resize: vertical;
      outline: none;
      line-height: 1.6;
      transition: border-color 0.2s, box-shadow 0.2s;
      font-family: inherit;
    }
    textarea::placeholder { color: rgba(154, 160, 196, 0.6); }
    textarea:focus {
      border-color: rgba(139, 108, 255, 0.6);
      box-shadow: 0 0 0 4px rgba(139, 108, 255, 0.12), 0 0 34px -8px rgba(139, 108, 255, 0.55);
    }

    .styles { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    .styles-label { font-size: 14px; color: var(--muted); margin-right: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 9px; }
    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
    }
    .chip:hover { color: var(--text); border-color: var(--line-strong); transform: translateY(-1px); }
    .chip.active {
      background: var(--grad);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 26px -8px rgba(139, 108, 255, 0.65);
    }

    .actions { display: flex; gap: 12px; margin-top: 22px; }
    .btn {
      border: none;
      border-radius: 13px;
      padding: 13px 20px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn.primary {
      flex: 1;
      background: var(--grad);
      color: #fff;
      box-shadow: 0 12px 34px -10px rgba(139, 108, 255, 0.65);
      position: relative;
      overflow: hidden;
    }
    .btn.primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 18px 44px -12px rgba(255, 121, 198, 0.7);
    }
    .btn.primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn.ghost { background: rgba(255, 255, 255, 0.06); color: var(--text); border: 1px solid var(--line); }
    .btn.ghost:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--line-strong); transform: translateY(-1px); }
    .btn.small {
      padding: 7px 14px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 11px;
      transition: all 0.18s;
    }
    .btn.small:hover { background: rgba(255, 255, 255, 0.13); border-color: var(--line-strong); transform: translateY(-1px); }

    .hint { color: var(--err); font-size: 13px; margin-top: 12px; min-height: 18px; }
    .result .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .badge {
      font-size: 12px;
      color: var(--text);
      background: rgba(139, 108, 255, 0.14);
      border: 1px solid rgba(139, 108, 255, 0.32);
      padding: 5px 13px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      letter-spacing: 0.3px;
    }
    .story {
      font-size: 19px;
      line-height: 2;
      letter-spacing: 0.3px;
      color: var(--text);
      min-height: 1em;
    }
    .story mark {
      background: linear-gradient(180deg, rgba(255, 226, 122, 0), rgba(255, 226, 122, 0.9));
      color: var(--marktext);
      padding: 2px 6px;
      border-radius: 7px;
      font-weight: 600;
      box-shadow: 0 0 0 1px rgba(255, 226, 122, 0.4) inset;
    }
    .wordlist {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
    }
    .wl-item {
      font-size: 13px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      padding: 6px 12px;
      border-radius: 10px;
    }
    .wl-item b { color: var(--primary2); font-weight: 700; }

    /* ===== 反馈（夯 / 拉）===== */
    .feedback {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      flex-wrap: wrap;
      animation: rise 0.4s ease both;
    }
    .fb-label { font-size: 13px; color: var(--muted); }
    .fb-state { font-size: 13px; color: var(--accent); }
    .btn.fb.good.chosen { background: rgba(92, 225, 230, 0.18); border-color: var(--accent); color: var(--accent); }
    .btn.fb.bad.chosen { background: rgba(255, 138, 138, 0.16); border-color: var(--err); color: var(--err); }

    .hidden { display: none !important; }
    .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 26px; letter-spacing: 0.6px; opacity: 0.85; }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>📖 把单词变成故事</h1>
      <p class="sub">Made by <strong>Grayson Shen</strong> in Hangzhou</p>
    </header>

    <main class="card">
      <label class="field-label" for="words">用逗号、空格或换行分隔单词</label>
      <textarea id="words" rows="3" placeholder="点击左下角的示例试一试，或者输入 申哲 试一试"></textarea>

      <div class="styles">
        <span class="styles-label">风格选择</span>
        <div class="chips" id="chips">
          <button class="chip active" data-style="荒诞脑洞" type="button">荒诞脑洞</button>
          <button class="chip" data-style="温馨治愈" type="button">温馨治愈</button>
          <button class="chip" data-style="悬疑推理" type="button">悬疑推理</button>
          <button class="chip" data-style="童话奇遇" type="button">童话奇遇</button>
        </div>
      </div>

      <div class="actions">
        <button id="exampleBtn" class="btn ghost" type="button">示例</button>
        <button id="genBtn" class="btn primary" type="button">✨ 生成故事</button>
      </div>
      <p class="hint" id="hint"></p>
    </main>

    <section class="result card hidden" id="result">
      <div class="result-head">
        <span class="badge">✨ 生成结果</span>
        <button id="copyBtn" class="btn small" type="button">复制</button>
      </div>
      <p class="story" id="story"></p>
      <div class="wordlist" id="wordlist"></div>
      <div class="feedback hidden" id="feedback">
        <span class="fb-label">这个故事怎么样？</span>
        <button id="goodBtn" class="btn small fb good" type="button">夯 👍</button>
        <button id="badBtn" class="btn small fb bad" type="button">拉 👎</button>
        <span class="fb-state" id="fbState"></span>
      </div>
    </section>

    <footer class="foot">连接人群，创造价值</footer>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const wordsEl = $('#words');
    const genBtn = $('#genBtn');
    const hint = $('#hint');
    const resultEl = $('#result');
    const storyEl = $('#story');
    const wordlistEl = $('#wordlist');
    const copyBtn = $('#copyBtn');
    const exampleBtn = $('#exampleBtn');
    const chipsEl = $('#chips');
    const feedbackEl = $('#feedback');
    const goodBtn = $('#goodBtn');
    const badBtn = $('#badBtn');
    const fbState = $('#fbState');

    let style = '荒诞脑洞';
    let currentResult = null; // {id, story, words, style}

    chipsEl.addEventListener('click', (e) => {
      const c = e.target.closest('.chip');
      if (!c) return;
      [...chipsEl.children].forEach((x) => x.classList.remove('active'));
      c.classList.add('active');
      style = c.dataset.style;
    });

    exampleBtn.addEventListener('click', () => {
      wordsEl.value = 'marriage, against, produce, attention, dull';
      hint.textContent = '';
    });

    function parseWords(raw) {
      return raw
        .split(/[\s,，;；\n]+/)
        .map((w) => w.trim().toLowerCase())
        .filter(Boolean);
    }

    genBtn.addEventListener('click', generate);

    async function generate() {
      const words = parseWords(wordsEl.value);
      if (words.length === 0) {
        hint.textContent = '请输入至少一个英文单词。';
        return;
      }
      if (words.length > 20) {
        hint.textContent = '最多 20 个单词，精简一下～';
        return;
      }
      hint.textContent = '';
      genBtn.disabled = true;
      genBtn.textContent = '生成中…';
      storyEl.textContent = '';
      wordlistEl.innerHTML = '';
      resultEl.classList.remove('hidden');
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ words, style }),
        });
        if (!res.ok) {
          let msg = `请求失败（${res.status}）`;
          try {
            const d = await res.json();
            if (d && d.error) msg = d.error;
          } catch (e) {}
          throw new Error(msg);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        let meta = null;
        let streamedStory = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf('\n')) !== -1) {
            const line = buf.slice(0, nl);
            buf = buf.slice(nl + 1);
            if (!line.trim()) continue;
            let obj;
            try { obj = JSON.parse(line); } catch (e) { continue; }
            if (obj.type === 'chunk') {
              streamedStory += obj.text;
              storyEl.textContent = streamedStory;
            } else if (obj.type === 'meta') {
              meta = obj;
            } else if (obj.type === 'error') {
              throw new Error(obj.error || '生成失败');
            }
          }
        }

        const story = (meta && meta.story) ? meta.story : streamedStory;
        const wordList = (meta && meta.words) || [];
        render(story, wordList);
        showFeedback(story, wordList, style);
      } catch (err) {
        hint.textContent = '出错了：' + err.message;
      } finally {
        genBtn.disabled = false;
        genBtn.textContent = '✨ 生成故事';
      }
    }

    function render(story, words) {
      const cns = (words || []).map((w) => w.cn).filter(Boolean);
      storyEl.innerHTML = highlight(story, cns);
      wordlistEl.innerHTML = (words || [])
        .map((w) => `<span class="wl-item"><b>${esc(w.word)}</b> → ${esc(w.cn)}</span>`)
        .join('');
      resultEl.classList.remove('hidden');
    }

    function showFeedback(story, wordList, style) {
      // 彩蛋（无词表）不展示反馈；正常生成才展示
      if (!wordList || wordList.length === 0) {
        feedbackEl.classList.add('hidden');
        currentResult = null;
        return;
      }
      currentResult = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        story: story,
        words: wordList,
        style: style,
      };
      feedbackEl.classList.remove('hidden');
      fbState.textContent = '';
      goodBtn.classList.remove('chosen');
      badBtn.classList.remove('chosen');
    }

    async function rate(rating) {
      if (!currentResult) return;
      const payload = { ...currentResult, rating };
      try {
        const res = await fetch('/api/rate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const d = await res.json().catch(() => ({}));
        if (d.ok) {
          fbState.textContent = rating === 'good' ? '已记录：夯 👍' : '已记录：拉 👎';
          goodBtn.classList.toggle('chosen', rating === 'good');
          badBtn.classList.toggle('chosen', rating === 'bad');
        } else {
          fbState.textContent = '保存失败：' + (d.error || '未知');
        }
      } catch (e) {
        fbState.textContent = '网络错误，未保存';
      }
    }

    goodBtn.addEventListener('click', () => rate('good'));
    badBtn.addEventListener('click', () => rate('bad'));

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(storyEl.textContent);
        copyBtn.textContent = '已复制';
        setTimeout(() => (copyBtn.textContent = '复制'), 1500);
      } catch {
        hint.textContent = '复制失败，请手动选择文本复制。';
      }
    });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[m]));
    }

    // 高亮：把中文词在故事中原样 <mark> 包裹，处理重叠（优先长词）
    function highlight(text, cns) {
      const list = [...new Set(cns)].filter(Boolean).sort((a, b) => b.length - a.length);
      const matches = [];
      list.forEach((cn) => {
        let i = text.indexOf(cn);
        while (i !== -1) {
          matches.push([i, i + cn.length]);
          i = text.indexOf(cn, i + cn.length);
        }
      });
      matches.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
      let out = '';
      let last = 0;
      for (const [s, e] of matches) {
        if (s < last) continue;
        out += esc(text.slice(last, s)) + '<mark>' + esc(text.slice(s, e)) + '</mark>';
        last = e;
      }
      out += esc(text.slice(last));
      return out;
    }
  </script>
</body>
</html>
