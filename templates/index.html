<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>单词故事生成器 · Word Story</title>

<style>
:root {
  --bg:#0f1020;
  --card:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.12);
  --text:#e8e8f0;
  --muted:#a0a0c0;
  --primary:#7c5cff;
  --primary2:#ff6ec7;
  --mark:#ffe066;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
background:
radial-gradient(1200px 600px at 50% -10%,#2a1b4d,transparent),
linear-gradient(160deg,#0f1020,#14152e);
color:var(--text);
min-height:100vh;
padding:24px 16px;
}

.app{
max-width:680px;
margin:auto;
}

.hero{
text-align:center;
margin:24px 0 28px;
}

.hero h1{
font-size:30px;
color:#fff;
}

.sub{
color:var(--muted);
margin-top:12px;
line-height:1.7;
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:22px;
margin-bottom:18px;
}

textarea{
width:100%;
height:100px;
background:#0005;
border:1px solid var(--line);
border-radius:12px;
color:white;
padding:14px;
font-size:16px;
}

.btn{
padding:12px 18px;
border-radius:12px;
border:none;
cursor:pointer;
}

.primary{
width:100%;
background:linear-gradient(90deg,var(--primary),var(--primary2));
color:white;
}

.story{
font-size:18px;
line-height:1.9;
}

.story mark{
background:var(--mark);
padding:2px 5px;
border-radius:5px;
}

.hidden{
display:none;
}

.wordlist{
margin-top:20px;
}
</style>

</head>


<body>


<div class="app">


<header class="hero">

<h1>📖 单词故事生成器</h1>

<p class="sub">
输入英文单词，AI生成荒诞中文小故事，
<br>
每个词的中文意思都会藏在故事里。
</p>

</header>


<main class="card">


<label>
英文单词（空格、逗号或换行分隔）
</label>


<textarea id="words"
placeholder="dog apple clock"></textarea>


<button
id="genBtn"
class="btn primary">
✨ 生成故事
</button>


<p id="hint"></p>


</main>



<section
id="result"
class="card hidden">


<div
class="story"
id="story">
</div>


<div
class="wordlist"
id="wordlist">
</div>


</section>


</div>



<script>


const wordsEl =
document.querySelector("#words");

const genBtn =
document.querySelector("#genBtn");

const storyEl =
document.querySelector("#story");

const wordlistEl =
document.querySelector("#wordlist");

const resultEl =
document.querySelector("#result");

const hint =
document.querySelector("#hint");



function parseWords(text){

return text
.split(/[\s,，;；\n]+/)
.map(x=>x.trim().toLowerCase())
.filter(Boolean);

}



genBtn.onclick = async()=>{


const words =
parseWords(wordsEl.value);


if(!words.length){

hint.innerText="请输入单词";

return;

}


resultEl.classList.remove("hidden");

storyEl.innerText="";

wordlistEl.innerHTML="";


let raw="";

let wordsData=[];


const res =
await fetch(
"/api/generate",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
words
})

}

);



const reader =
res.body.getReader();

const decoder =
new TextDecoder();



while(true){


const {
done,
value
}=await reader.read();



if(done)
break;



const chunk =
decoder.decode(value);



for(const line of chunk.split("\n")){


if(!line.startsWith("data:"))
continue;



const data =
JSON.parse(
line.substring(5)
);



if(data.type==="text"){

raw += data.content;


const match =
raw.match(
/"story"\s*:\s*"([\s\S]*)/
);


if(match){

storyEl.innerText =
match[1]
.replace(/\\"/g,'"');

}

}



if(data.type==="done"){

wordsData=data.words;

}

}


}



render(
storyEl.innerText,
wordsData
);


};



function render(text,words){


let html =
text;


for(const w of words){

html =
html.replace(
w.cn,
"<mark>"+w.cn+"</mark>"
);

}


storyEl.innerHTML=html;


wordlistEl.innerHTML =
words.map(
w=>`
<div>
<b>${w.word}</b>
 → 
${w.cn}
</div>
`
).join("");

}


</script>


</body>
</html>
