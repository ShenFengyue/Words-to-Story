<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Words to Story · 单词炼成故事</title>
  <meta name="description" content="Made by Grayson Shen" />
  <style>
    :root {
      /* 墨黑 + 香槟金 · 高级编辑风 */
      --bg-0: #0a0b0f;
      --bg-1: #111219;
      --surface: rgba(255, 255, 255, 0.035);
      --surface-2: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.09);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text: #ECEEF4;
      --muted: #8E95AC;
      --gold: #D9B26A;
      --gold-2: #E9CB93;
      --gold-soft: rgba(217, 178, 106, 0.14);
      --gold-line: rgba(217, 178, 106, 0.34);
      --rose: #E0896F;
      --mark-bg: linear-gradient(180deg, rgba(217, 178, 106, 0) 26%, rgba(217, 178, 106, 0.82) 100%);
      --mark-text: #1b1505;
      --err: #E58A8A;
      --radius: 20px;
      --radius-sm: 12px;
      --shadow: 0 30px 80px -34px rgba(0, 0, 0, 0.85);
      --grad: linear-gradient(120deg, var(--gold), var(--gold-2));
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg-0);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 18px 64px;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    /* 顶部一抹暖光，营造高级氛围 */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(900px 480px at 50% -8%, rgba(217, 178, 106, 0.10), transparent 60%),
        radial-gradient(700px 520px at 100% 0%, rgba(224, 137, 111, 0.05), transparent 55%);
      pointer-events: none;
      z-index: 0;
    }
    .app { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes fadein {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes shimmer {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }

    .hero { text-align: center; margin: 8px 0 34px; }
    .hero h1 {
      font-size: 38px;
      font-weight: 800;
      line-height: 1.18;
      letter-spacing: 0.5px;
      background: linear-gradient(100deg, #ffffff 0%, var(--gold-2) 52%, var(--gold) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 8px 30px rgba(217, 178, 106, 0.22));
    }
    .hero .en {
      display: block;
      margin-top: 10px;
      font-size: 12.5px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
    }
    .sub {
      color: var(--muted);
      margin-top: 16px;
      font-size: 15px;
      letter-spacing: 0.3px;
    }
    .sub strong { font-weight: 600; color: var(--gold-2); }

    .card {
      background: linear-gradient(180deg, var(--surface-2), var(--surface));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .field-label {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }
    .field-label .tip { font-size: 12px; color: rgba(142, 149, 172, 0.75); }
    .field-label kbd {
      font-family: inherit;
      font-size: 11px;
      color: var(--gold-2);
      background: var(--gold-soft);
      border: 1px solid var(--gold-line);
      border-radius: 6px;
      padding: 1px 7px;
      margin: 0 2px;
    }

    textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.30);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 16px;
      font-size: 16px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
      transition: border-color 0.22s, box-shadow 0.22s, background 0.22s;
      font-family: inherit;
    }
    textarea::placeholder { color: rgba(142, 149, 172, 0.55); }
    textarea:focus {
      border-color: var(--gold-line);
      background: rgba(0, 0, 0, 0.36);
      box-shadow: 0 0 0 4px rgba(217, 178, 106, 0.10), 0 0 36px -10px rgba(217, 178, 106, 0.45);
    }

    .styles { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 22px; }
    .styles-label { font-size: 13.5px; color: var(--muted); margin-right: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 9px; }
    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip:hover { color: var(--text); border-color: var(--border-strong); transform: translateY(-1px); }
    .chip.active {
      background: var(--grad);
      color: #20180a;
      font-weight: 600;
      border-color: transparent;
      box-shadow: 0 10px 26px -10px rgba(217, 178, 106, 0.6);
    }

    .actions { display: flex; gap: 12px; margin-top: 24px; }
    .btn {
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px 20px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn.primary {
      flex: 1;
      background: var(--grad);
      color: #20180a;
      box-shadow: 0 14px 36px -12px rgba(217, 178, 106, 0.6);
    }
    .btn.primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 20px 46px -14px rgba(233, 203, 147, 0.7);
    }
    .btn.primary:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn.ghost { background: rgba(255, 255, 255, 0.05); color: var(--text); border: 1px solid var(--border); }
    .btn.ghost:hover { background: rgba(255, 255, 255, 0.11); border-color: var(--border-strong); transform: translateY(-1px); }
    .btn.small {
      padding: 7px 14px;
      font-size: 13px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 11px;
      transition: all 0.18s;
    }
    .btn.small:hover { background: rgba(255, 255, 255, 0.12); border-color: var(--border-strong); transform: translateY(-1px); }

    .hint { color: var(--err); font-size: 13px; margin-top: 12px; min-height: 18px; }

    .result .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .badge {
      font-size: 12px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: var(--gold-2);
      background: var(--gold-soft);
      border: 1px solid var(--gold-line);
      padding: 6px 14px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 8px var(--gold); }

    .story {
      font-family: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif SC", Georgia, "PingFang SC", serif;
      font-size: 20.5px;
      line-height: 2.05;
      letter-spacing: 0.4px;
      color: #F4F1E8;
      min-height: 1em;
    }
    .story.empty { color: var(--muted); font-family: inherit; font-size: 15px; line-height: 1.8; animation: shimmer 1.6s ease-in-out infinite; }
    .story mark {
      background: none;
      color: inherit;
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: var(--gold);
      text-decoration-thickness: 2px;
      text-underline-offset: 4px;
      padding: 0;
      border-radius: 0;
      box-shadow: none;
    }

    .wordlist {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }
    .wl-item {
      font-size: 13px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 10px;
    }
    .wl-item b { color: var(--gold-2); font-weight: 700; }

    /* ===== 反馈（夯 / 拉）===== */
    .feedback {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      animation: rise 0.45s ease both;
    }
    .fb-label { font-size: 13.5px; color: var(--muted); }
    .fb-state { font-size: 13px; color: var(--gold-2); }
    .btn.fb.good.chosen { background: var(--gold-soft); border-color: var(--gold-line); color: var(--gold-2); }
    .btn.fb.bad.chosen { background: rgba(224, 137, 111, 0.16); border-color: rgba(224, 137, 111, 0.5); color: var(--rose); }

    .hidden { display: none !important; }
    .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 28px; letter-spacing: 1.2px; opacity: 0.7; }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>把单词变成故事<span class="en">Words&nbsp;to&nbsp;Story</span></h1>
      <p class="sub">Made by <strong>Grayson Shen</strong></p>
    </header>

    <main class="card">
      <label class="field-label" for="words">
        <span>输入英文单词</span>
        <span class="tip">用逗号 / 空格分隔 · 输入后按 <kbd>Enter</kbd> 生成</span>
      </label>
      <textarea id="words" rows="3" placeholder="例如：marriage, against, produce, attention, dull（或输入「申哲」试试）"></textarea>

      <div class="styles">
        <span class="styles-label">风格</span>
        <div class="chips" id="chips">
          <button class="chip active" data-style="荒诞脑洞" type="button">荒诞脑洞</button>
          <button class="chip" data-style="温馨治愈" type="button">温馨治愈</button>
          <button class="chip" data-style="悬疑推理" type="button">悬疑推理</button>
          <button class="chip" data-style="童话奇遇" type="button">童话奇遇</button>
        </div>
      </div>

      <div class="actions">
        <button id="exampleBtn" class="btn ghost" type="button">示例</button>
        <button id="genBtn" class="btn primary" type="button">生成故事</button>
      </div>
      <p class="hint" id="hint"></p>
    </main>

    <section class="result card hidden" id="result">
      <div class="result-head">
        <span class="badge">生成结果</span>
        <button id="copyBtn" class="btn small" type="button">复制</button>
      </div>
      <p class="story empty" id="story">正在编织故事…</p>
      <div class="wordlist" id="wordlist"></div>
      <div class="feedback hidden" id="feedback">
        <span class="fb-label">这个故事怎么样？</span>
        <button id="goodBtn" class="btn small fb good" type="button">夯 👍</button>
        <button id="badBtn" class="btn small fb bad" type="button">拉 👎</button>
        <span class="fb-state" id="fbState"></span>
      </div>
    </section>

    <footer class="foot">连接人群 · 创造价值</footer>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const wordsEl = $('#words');
    const genBtn = $('#genBtn');
    const hint = $('#hint');
    const resultEl = $('#result');
    const storyEl = $('#story');
    const wordlistEl = $('#wordlist');
    const copyBtn = $('#copyBtn');
    const exampleBtn = $('#exampleBtn');
    const chipsEl = $('#chips');
    const feedbackEl = $('#feedback');
    const goodBtn = $('#goodBtn');
    const badBtn = $('#badBtn');
    const fbState = $('#fbState');

    let style = '荒诞脑洞';
    let currentResult = null; // {id, story, words, style}

    chipsEl.addEventListener('click', (e) => {
      const c = e.target.closest('.chip');
      if (!c) return;
      [...chipsEl.children].forEach((x) => x.classList.remove('active'));
      c.classList.add('active');
      style = c.dataset.style;
    });

    exampleBtn.addEventListener('click', () => {
      wordsEl.value = 'marriage, against, produce, attention, dull';
      hint.textContent = '';
      wordsEl.focus();
    });

    // 输入框聚焦时，按 Enter 直接生成；Shift+Enter 才换行
    wordsEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        generate();
      }
    });

    function parseWords(raw) {
      return raw
        .split(/[\s,，;；\n]+/)
        .map((w) => w.trim().toLowerCase())
        .filter(Boolean);
    }

    genBtn.addEventListener('click', generate);

    async function generate() {
      if (genBtn.disabled) return;
      const words = parseWords(wordsEl.value);
      if (words.length === 0) {
        hint.textContent = '请输入至少一个英文单词。';
        return;
      }
      if (words.length > 20) {
        hint.textContent = '最多 20 个单词，精简一下～';
        return;
      }
      hint.textContent = '';
      genBtn.disabled = true;
      genBtn.textContent = '生成中…';
      storyEl.className = 'story empty';
      storyEl.textContent = '正在编织故事…';
      wordlistEl.innerHTML = '';
      feedbackEl.classList.add('hidden');
      resultEl.classList.remove('hidden');
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ words, style }),
        });
        if (!res.ok) {
          let msg = `请求失败（${res.status}）`;
          try {
            const d = await res.json();
            if (d && d.error) msg = d.error;
          } catch (e) {}
          throw new Error(msg);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        let meta = null;
        let streamedStory = '';
        let firstChunk = true;
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf('\n')) !== -1) {
            const line = buf.slice(0, nl);
            buf = buf.slice(nl + 1);
            if (!line.trim()) continue;
            let obj;
            try { obj = JSON.parse(line); } catch (e) { continue; }
            if (obj.type === 'chunk') {
              if (firstChunk) { storyEl.className = 'story'; firstChunk = false; }
              streamedStory += obj.text;
              storyEl.textContent = streamedStory;
            } else if (obj.type === 'meta') {
              meta = obj;
            } else if (obj.type === 'error') {
              throw new Error(obj.error || '生成失败');
            }
          }
        }

        const story = (meta && meta.story) ? meta.story : streamedStory;
        const wordList = (meta && meta.words) || [];
        render(story, wordList);
        showFeedback(story, wordList, style);
      } catch (err) {
        hint.textContent = '出错了：' + err.message;
        storyEl.className = 'story';
        storyEl.textContent = '';
      } finally {
        genBtn.disabled = false;
        genBtn.textContent = '生成故事';
      }
    }

    function render(story, words) {
      const cns = (words || []).map((w) => w.cn).filter(Boolean);
      storyEl.className = 'story';
      storyEl.innerHTML = highlight(story, cns);
      wordlistEl.innerHTML = (words || [])
        .map((w) => `<span class="wl-item"><b>${esc(w.word)}</b> → ${esc(w.cn)}</span>`)
        .join('');
      resultEl.classList.remove('hidden');
    }

    function showFeedback(story, wordList, style) {
      // 彩蛋（无词表）不展示反馈；正常生成才展示
      if (!wordList || wordList.length === 0) {
        feedbackEl.classList.add('hidden');
        currentResult = null;
        return;
      }
      currentResult = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        story: story,
        words: wordList,
        style: style,
      };
      feedbackEl.classList.remove('hidden');
      fbState.textContent = '';
      goodBtn.classList.remove('chosen');
      badBtn.classList.remove('chosen');
    }

    async function rate(rating) {
      if (!currentResult) return;
      const payload = { ...currentResult, rating };
      try {
        const res = await fetch('/api/rate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const d = await res.json().catch(() => ({}));
        if (d.ok) {
          fbState.textContent = rating === 'good' ? '已记录：夯 👍' : '已记录：拉 👎';
          goodBtn.classList.toggle('chosen', rating === 'good');
          badBtn.classList.toggle('chosen', rating === 'bad');
        } else {
          fbState.textContent = '保存失败：' + (d.error || '未知');
        }
      } catch (e) {
        fbState.textContent = '网络错误，未保存';
      }
    }

    goodBtn.addEventListener('click', () => rate('good'));
    badBtn.addEventListener('click', () => rate('bad'));

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(storyEl.textContent);
        copyBtn.textContent = '已复制';
        setTimeout(() => (copyBtn.textContent = '复制'), 1500);
      } catch {
        hint.textContent = '复制失败，请手动选择文本复制。';
      }
    });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[m]));
    }

    // 高亮：把中文词在故事中原样 <mark> 包裹，处理重叠（优先长词）
    function highlight(text, cns) {
      const list = [...new Set(cns)].filter(Boolean).sort((a, b) => b.length - a.length);
      const matches = [];
      list.forEach((cn) => {
        let i = text.indexOf(cn);
        while (i !== -1) {
          matches.push([i, i + cn.length]);
          i = text.indexOf(cn, i + cn.length);
        }
      });
      matches.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
      let out = '';
      let last = 0;
      for (const [s, e] of matches) {
        if (s < last) continue;
        out += esc(text.slice(last, s)) + '<mark>' + esc(text.slice(s, e)) + '</mark>';
        last = e;
      }
      out += esc(text.slice(last));
      return out;
    }
  </script>
</body>
</html>
