<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>单词故事生成器</title>

<style>

body{
background:#111;
color:white;
font-family:sans-serif;
max-width:700px;
margin:auto;
padding:30px;
}

textarea{
width:100%;
height:100px;
font-size:18px;
padding:10px;
}

button{
padding:12px 20px;
margin-top:15px;
cursor:pointer;
}

.story{
font-size:22px;
line-height:2;
margin-top:30px;
}

mark{
background:#ffe066;
padding:3px;
}

.words{
margin-top:20px;
}

</style>

</head>


<body>


<h1>📖 单词故事生成器</h1>


<p>
输入任意英文单词，AI生成荒诞中文故事
</p>


<textarea id="words"
placeholder="dog apple clock">
</textarea>


<br>


<button id="generate">
✨ 生成故事
</button>


<p id="error"></p>


<div class="story" id="story"></div>


<div class="words" id="wordlist"></div>



<script>


const wordsInput =
document.querySelector("#words");


const btn =
document.querySelector("#generate");


const storyEl =
document.querySelector("#story");


const wordList =
document.querySelector("#wordlist");


const errorEl =
document.querySelector("#error");



function parseWords(text){

return text
.split(/[\s,，;；\n]+/)
.map(x=>x.trim().toLowerCase())
.filter(Boolean);

}



btn.onclick = async()=>{


const words =
parseWords(wordsInput.value);



if(words.length===0){

errorEl.innerText="请输入单词";

return;

}



storyEl.innerText="";

wordList.innerHTML="";



const res =
await fetch(
"/api/generate",
{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
words
})

}

);



const reader =
res.body.getReader();


const decoder =
new TextDecoder();


let raw="";

let finalWords=[];



while(true){


const {
done,
value
}=await reader.read();


if(done)
break;



const chunk =
decoder.decode(value);



for(const line of chunk.split("\n")){


if(!line.startsWith("data:"))
continue;



const data =
JSON.parse(
line.slice(5)
);



if(data.type==="text"){

raw += data.content;


let match =
raw.match(
/"story"\s*:\s*"([\s\S]*)/
);


if(match){

storyEl.innerText =
match[1]
.replace(/\\"/g,'"');

}

}



if(data.type==="done"){

finalWords =
data.words;

}

}


}



render(
storyEl.innerText,
finalWords
);


};



function render(text, words){


let html =
escape(text);



words
.map(x=>x.cn)
.sort((a,b)=>b.length-a.length)
.forEach(cn=>{

html =
html.replace(
cn,
"<mark>"+cn+"</mark>"
);

});



storyEl.innerHTML=html;



wordList.innerHTML =
words.map(
w=>
`
<div>
<b>${w.word}</b>
→
${w.cn}
</div>
`
).join("");



}



function escape(str){

return str
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

}



</script>


</body>

</html>
