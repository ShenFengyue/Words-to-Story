<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Words to Story</title>
  <meta name="description" content="Made by Grayson Shen" />
  <style>
    :root {
      --bg: #0f1020;
      --card: rgba(255, 255, 255, 0.06);
      --line: rgba(255, 255, 255, 0.12);
      --text: #e8e8f0;
      --muted: #a0a0c0;
      --primary: #7c5cff;
      --primary2: #ff6ec7;
      --mark: #ffe066;
      --marktext: #1a1a00;
      --err: #ff8a8a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, #2a1b4d, transparent),
        linear-gradient(160deg, #0f1020, #14152e);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px;
    }
    .app { max-width: 680px; margin: 0 auto; }
    .hero { text-align: center; margin: 24px 0 28px; }
    .hero h1 {
  font-size: 30px;
  line-height: 1.2;
  background: linear-gradient(90deg, var(--primary), var(--primary2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
    .sub {
  color: var(--muted);
  margin-top: 8px;
  font-size: 17px;
  font-weight: 400;
  letter-spacing: 0.5px;
  opacity: 0.9;
}
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      backdrop-filter: blur(8px);
      margin-bottom: 18px;
    }
    .field-label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 10px; }
    textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      padding: 14px;
      font-size: 16px;
      resize: vertical;
      outline: none;
      line-height: 1.6;
    }
    textarea:focus { border-color: var(--primary); }
    .styles { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    .styles-label { font-size: 14px; color: var(--muted); margin-right: 2px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--line);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s;
    }
    .chip:hover { color: var(--text); }
    .chip.active {
      background: linear-gradient(90deg, var(--primary), var(--primary2));
      color: #fff;
      border-color: transparent;
    }
    .actions { display: flex; gap: 12px; margin-top: 20px; }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.15s;
    }
    .btn.primary { flex: 1; background: linear-gradient(90deg, var(--primary), var(--primary2)); color: #fff; }
    .btn.primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn.ghost { background: rgba(255, 255, 255, 0.06); color: var(--text); border: 1px solid var(--line); }
    .btn.small { padding: 6px 12px; font-size: 13px; background: rgba(255, 255, 255, 0.08); color: var(--text); border: 1px solid var(--line); }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .hint { color: var(--err); font-size: 13px; margin-top: 10px; min-height: 18px; }
    .result .result-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .badge {
      font-size: 12px;
      color: var(--muted);
      background: rgba(124, 92, 255, 0.15);
      border: 1px solid rgba(124, 92, 255, 0.3);
      padding: 4px 10px;
      border-radius: 999px;
    }
    .story { font-size: 18px; line-height: 1.9; letter-spacing: 0.3px; }
    .story mark { background: var(--mark); color: var(--marktext); padding: 1px 5px; border-radius: 6px; font-weight: 600; }
    .wordlist {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px dashed var(--line);
    }
    .wl-item { font-size: 13px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); padding: 5px 10px; border-radius: 8px; }
    .wl-item b { color: var(--primary2); }
    .hidden { display: none; }
    .foot { text-align: center; color: var(--muted); font-size: 12px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <h1>📖 把单词变成故事</h1>
      <p class="sub">Made by Grayson Shen</p>
    </header>

    <main class="card">
      <label class="field-label" for="words">用逗号、空格或换行分隔单词</label>
      <textarea id="words" rows="3" placeholder="点击左下角的示例试一试"></textarea>

      <div class="styles">
        <span class="styles-label">风格选择</span>
        <div class="chips" id="chips">
          <button class="chip active" data-style="荒诞脑洞" type="button">荒诞脑洞</button>
          <button class="chip" data-style="温馨治愈" type="button">温馨治愈</button>
          <button class="chip" data-style="悬疑推理" type="button">悬疑推理</button>
          <button class="chip" data-style="童话奇遇" type="button">童话奇遇</button>
        </div>
      </div>

      <div class="actions">
        <button id="exampleBtn" class="btn ghost" type="button">示例</button>
        <button id="genBtn" class="btn primary" type="button">✨ 生成故事</button>
      </div>
      <p class="hint" id="hint"></p>
    </main>

    <section class="result card hidden" id="result">
      <div class="result-head">
        
        <button id="copyBtn" class="btn small" type="button">复制</button>
      </div>
      <p class="story" id="story"></p>
      <div class="wordlist" id="wordlist"></div>
    </section>

    <footer class="foot">连接人群,创造价值</footer>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const wordsEl = $('#words');
    const genBtn = $('#genBtn');
    const hint = $('#hint');
    const resultEl = $('#result');
    const storyEl = $('#story');
    const wordlistEl = $('#wordlist');
    const copyBtn = $('#copyBtn');
    const exampleBtn = $('#exampleBtn');
    const chipsEl = $('#chips');

    let style = '荒诞脑洞';

    chipsEl.addEventListener('click', (e) => {
      const c = e.target.closest('.chip');
      if (!c) return;
      [...chipsEl.children].forEach((x) => x.classList.remove('active'));
      c.classList.add('active');
      style = c.dataset.style;
    });

    exampleBtn.addEventListener('click', () => {
      wordsEl.value = 'marriage, against, produce, attention, dull';
      hint.textContent = '';
    });

    function parseWords(raw) {
      return raw
        .split(/[\s,，;；\n]+/)
        .map((w) => w.trim().toLowerCase())
        .filter(Boolean);
    }

    genBtn.addEventListener('click', generate);

    async function generate() {
      const words = parseWords(wordsEl.value);
      if (words.length === 0) {
        hint.textContent = '请输入至少一个英文单词。';
        return;
      }
      if (words.length > 20) {
        hint.textContent = '最多 20 个单词，精简一下～';
        return;
      }
      hint.textContent = '';
      genBtn.disabled = true;
      genBtn.textContent = '生成中…';
      storyEl.textContent = '';
      wordlistEl.innerHTML = '';
      resultEl.classList.remove('hidden');
      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ words, style }),
        });
        if (!res.ok) {
          let msg = `请求失败（${res.status}）`;
          try {
            const d = await res.json();
            if (d && d.error) msg = d.error;
          } catch (e) {}
          throw new Error(msg);
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        let meta = null;
        let streamedStory = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let nl;
          while ((nl = buf.indexOf('\n')) !== -1) {
            const line = buf.slice(0, nl);
            buf = buf.slice(nl + 1);
            if (!line.trim()) continue;
            let obj;
            try { obj = JSON.parse(line); } catch (e) { continue; }
            if (obj.type === 'chunk') {
              streamedStory += obj.text;
              storyEl.textContent = streamedStory;
            } else if (obj.type === 'meta') {
              meta = obj;
            } else if (obj.type === 'error') {
              throw new Error(obj.error || '生成失败');
            }
          }
        }

        const story = (meta && meta.story) ? meta.story : streamedStory;
        const wordList = (meta && meta.words) || [];
        render(story, wordList);
      } catch (err) {
        hint.textContent = '出错了：' + err.message;
      } finally {
        genBtn.disabled = false;
        genBtn.textContent = '✨ 生成故事';
      }
    }

    function render(story, words) {
      const cns = (words || []).map((w) => w.cn).filter(Boolean);
      storyEl.innerHTML = highlight(story, cns);
      wordlistEl.innerHTML = (words || [])
        .map((w) => `<span class="wl-item"><b>${esc(w.word)}</b> → ${esc(w.cn)}</span>`)
        .join('');
      resultEl.classList.remove('hidden');
    }

    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(storyEl.textContent);
        copyBtn.textContent = '已复制';
        setTimeout(() => (copyBtn.textContent = '复制'), 1500);
      } catch {
        hint.textContent = '复制失败，请手动选择文本复制。';
      }
    });

    function esc(s) {
      return String(s).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[m]));
    }

    // 高亮：把中文词在故事中原样 <mark> 包裹，处理重叠（优先长词）
    function highlight(text, cns) {
      const list = [...new Set(cns)].filter(Boolean).sort((a, b) => b.length - a.length);
      const matches = [];
      list.forEach((cn) => {
        let i = text.indexOf(cn);
        while (i !== -1) {
          matches.push([i, i + cn.length]);
          i = text.indexOf(cn, i + cn.length);
        }
      });
      matches.sort((a, b) => a[0] - b[0] || (b[1] - b[0]) - (a[1] - a[0]));
      let out = '';
      let last = 0;
      for (const [s, e] of matches) {
        if (s < last) continue;
        out += esc(text.slice(last, s)) + '<mark>' + esc(text.slice(s, e)) + '</mark>';
        last = e;
      }
      out += esc(text.slice(last));
      return out;
    }
  </script>
</body>
</html>
