<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>管理 · Words to Story</title>
  <meta name="description" content="Made by Grayson Shen" />
  <style>
    :root {
      --bg: #08090c;
      --ink: #ECE7D9;
      --ink-soft: rgba(236, 231, 217, 0.58);
      --ink-faint: rgba(236, 231, 217, 0.34);
      --gold: #D9B26A;
      --gold-soft: rgba(217, 178, 106, 0.42);
      --hair: rgba(236, 231, 217, 0.12);
      --rose: #D9917A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      padding: 0 22px 80px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      position: relative;
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(1000px 520px at 50% -12%, rgba(217, 178, 106, 0.06), transparent 60%);
      pointer-events: none;
      z-index: 0;
    }
    .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; }

    @keyframes fadein {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    /* ===== 页头 ===== */
    .header {
      padding: 12vh 0 4vh;
      text-align: center;
    }
    .header h1 {
      font-size: 32px;
      font-weight: 300;
      letter-spacing: 6px;
      color: var(--ink);
    }
    .header .en {
      margin-top: 14px;
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: var(--gold);
    }
    .header .sub {
      margin-top: 20px;
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--ink-faint);
    }
    .header .sub a {
      color: var(--gold);
      text-decoration: none;
      border-bottom: 1px solid var(--gold-soft);
      transition: border-color 0.3s ease;
    }
    .header .sub a:hover { border-bottom-color: var(--gold); }

    .rule {
      width: 36px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 40px;
      opacity: 0.7;
    }

    /* ===== 操作栏 ===== */
    .bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .count {
      font-size: 13px;
      letter-spacing: 2px;
      color: var(--ink-faint);
    }
    .count b { color: var(--gold); font-weight: 500; }
    .act {
      background: none;
      border: none;
      color: var(--ink-soft);
      font-size: 13px;
      letter-spacing: 2px;
      cursor: pointer;
      padding: 4px 0;
      transition: color 0.25s ease;
      font-family: inherit;
    }
    .act:hover { color: var(--ink); }
    .act.gold { color: var(--gold); }
    .act.rose { color: var(--rose); }
    .sep { color: var(--ink-faint); font-size: 12px; user-select: none; }

    .hint {
      text-align: center;
      color: var(--rose);
      font-size: 13px;
      letter-spacing: 1px;
      min-height: 16px;
      margin-bottom: 20px;
    }

    /* ===== 记录列表 ===== */
    .empty {
      color: var(--ink-faint);
      text-align: center;
      padding: 60px 0;
      font-size: 14px;
      letter-spacing: 3px;
    }

    .item {
      border-bottom: 1px solid var(--hair);
      padding: 28px 0;
      animation: fadein 0.5s ease both;
    }
    .item:last-child { border-bottom: none; }

    .item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .meta {
      font-size: 12px;
      color: var(--ink-faint);
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
      letter-spacing: 1px;
    }
    .rating {
      font-size: 12px;
      letter-spacing: 2px;
    }
    .rating.good { color: var(--gold); }
    .rating.bad { color: var(--rose); }

    .del {
      background: none;
      border: none;
      color: var(--ink-faint);
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
      font-family: inherit;
      transition: color 0.25s ease;
    }
    .del:hover { color: var(--rose); }

    .words {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin-bottom: 14px;
    }
    .w {
      font-size: 12px;
      letter-spacing: 1px;
      color: var(--ink-soft);
    }
    .w b { color: var(--gold); font-weight: 500; }

    .story {
      font-family: "Songti SC", "STSong", "Source Han Serif SC", "Noto Serif SC", Georgia, serif;
      font-size: 18px;
      line-height: 2.05;
      letter-spacing: 1px;
      color: var(--ink);
    }

    .feature {
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--gold);
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px dashed var(--hair);
    }
    .feature::before { content: "好在哪里 · "; color: var(--ink-faint); }

    .foot {
      margin-top: 14vh;
      text-align: center;
      color: var(--ink-faint);
      font-size: 11px;
      letter-spacing: 3px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>记 忆 管 理</h1>
      <div class="en">Admin</div>
      <div class="sub">管理所有生成结果与评价 · <a href="/">返回主页</a></div>
    </header>

    <div class="rule"></div>

    <div class="bar">
      <span class="count" id="count">读取中…</span>
      <span class="sep">·</span>
      <button id="refreshBtn" class="act gold" type="button">刷 新</button>
      <span class="sep">·</span>
      <button id="clearBtn" class="act rose" type="button">清空全部</button>
    </div>
    <p class="hint" id="hint"></p>

    <div id="list"></div>

    <footer class="foot">Connecting People, Creating Value</footer>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const listEl = $('#list');
    const countEl = $('#count');
    const hint = $('#hint');

    // 从 URL 读取 ?key= 并附加到所有管理接口
    const KEY = new URLSearchParams(location.search).get('key') || '';
    const withKey = (url) => KEY ? (url + (url.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(KEY)) : url;

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (m) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[m]));
    }

    async function load() {
      hint.textContent = '';
      try {
        const res = await fetch(withKey('/api/admin/list'));
        if (!res.ok) {
          const d = await res.json().catch(() => ({}));
          throw new Error(d.error || ('HTTP ' + res.status));
        }
        const d = await res.json();
        const arr = (d.records || []).slice().reverse();
        countEl.innerHTML = '共 <b>' + arr.length + '</b> 条';
        if (arr.length === 0) {
          listEl.innerHTML = '<div class="empty">还没有记录</div>';
          return;
        }
        listEl.innerHTML = arr.map((r) => `
          <div class="item" data-id="${esc(r.id)}">
            <div class="item-top">
              <div class="meta">
                <span>${esc(r.ts)}</span>
                <span class="rating ${r.rating === 'good' ? 'good' : 'bad'}">${r.rating === 'good' ? '夯' : '拉'}</span>
                <span>${esc(r.style || '荒诞脑洞')}</span>
              </div>
              <button class="del" type="button">删除</button>
            </div>
            <div class="words">${(r.words || []).map((w) => `<span class="w"><b>${esc(w.word)}</b> → ${esc(w.cn)}</span>`).join('') || '<span class="w">—</span>'}</div>
            <div class="story">${esc(r.story)}</div>
            ${r.feature ? `<div class="feature">${esc(r.feature)}</div>` : ''}
          </div>
        `).join('');
      } catch (e) {
        hint.textContent = '读取失败：' + e.message;
        countEl.textContent = '';
      }
    }

    listEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('.del');
      if (!btn) return;
      const item = btn.closest('.item');
      const id = item.dataset.id;
      if (!confirm('确定删除这条记录吗？')) return;
      try {
        const res = await fetch(withKey('/api/admin/delete'), {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id }),
        });
        const d = await res.json().catch(() => ({}));
        if (d.ok) { load(); } else { hint.textContent = '删除失败：' + (d.error || '未知'); }
      } catch (err) {
        hint.textContent = '删除失败：' + err.message;
      }
    });

    $('#clearBtn').addEventListener('click', async () => {
      if (!confirm('确定清空全部记录吗？此操作不可撤销。')) return;
      try {
        const res = await fetch(withKey('/api/admin/clear'), { method: 'POST' });
        const d = await res.json().catch(() => ({}));
        if (d.ok) { load(); } else { hint.textContent = '清空失败：' + (d.error || '未知'); }
      } catch (err) {
        hint.textContent = '清空失败：' + err.message;
      }
    });

    $('#refreshBtn').addEventListener('click', load);

    load();
  </script>
</body>
</html>
